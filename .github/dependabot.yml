version: 2

updates:
  # Docusaurus + npm deps
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # wait 7 days for stability      
    cooldown:
      default-days: 7
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react*"
      others:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # GitHub Actions — pin to commit hash, version in comment
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # wait 7 days for stability
    cooldown:
      default-days: 7
    groups:
      gha-dependencies:
        patterns:
          - "*"
        # Optional: exclude major versions so we can review these
        # update-types:
        #   - "minor"
        #   - "patch"

    open-pull-requests-limit: 5
    labels:
      - "dependencies"


