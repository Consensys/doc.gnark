---
name: trivy-cache-db

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"      

jobs:
  trivy:
    name: Run trivy scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy Cache
        uses: ConsenSys/github-actions/trivy-update-cache@3a2429772a5d3653f0662a6a66299cad96e74196 # main
