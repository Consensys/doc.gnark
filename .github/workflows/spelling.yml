---
name: Check for spelling with vale

on:
  pull_request:
    branches:
      - main

jobs:
  vale:
    name: Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Vale
        uses: Consensys/github-actions/docs-spelling-check@31dbb917dd78b1dc18b4838a2d7d598b359b834f # main
