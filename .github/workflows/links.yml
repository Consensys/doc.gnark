---
name: Check for broken links

on:
  pull_request:
    branches:
      - main

jobs:

  linkCheck:
    name: Link Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: LinkCheck
        uses: ConsenSys/github-actions/docs-link-check@31dbb917dd78b1dc18b4838a2d7d598b359b834f # main
        with:
          CONFIG_FILE: .linkspector.yml
